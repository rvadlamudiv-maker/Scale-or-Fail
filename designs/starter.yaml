# Client -> LB -> App (4 instances) -> DB
# Each app request makes 1.5 DB calls on average.
components:
  - id: client
    type: client
  - id: lb
    type: load_balancer
  - id: app
    type: app_server
    instances: 4
  - id: db
    type: database
edges:
  - source: client
    target: lb
  - source: lb
    target: app
  - source: app
    target: db
    calls_per_request: 1.5
