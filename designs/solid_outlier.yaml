# Client -> LB -> App (8 instances) -> Cache -> DB
# Like solid, but the LB sends less traffic to slow app servers (least-outstanding requests).
components:
  - id: client
    type: client
  - id: lb
    type: load_balancer
  - id: app
    type: app_server
    instances: 8
    balancing: least_outstanding
    timeout_ms: 500
  - id: cache
    type: cache
  - id: db
    type: database
edges:
  - source: client
    target: lb
  - source: lb
    target: app
  - source: app
    target: cache
    calls_per_request: 1.5
  - source: cache
    target: db
