# Black Friday - starting design: sized for a normal Tuesday.
# 6 web servers and 2 databases. Every page view makes 1.5 database calls (1.4 reads, 0.1 writes).
components:
  - id: client
    type: client
  - id: lb
    type: load_balancer
  - id: web
    type: app_server
    instances: 6
    timeout_ms: 500
  - id: db
    type: database
    instances: 2
edges:
  - source: client
    target: lb
  - source: lb
    target: web
  - source: web
    target: db
    calls_per_request: 1.5
