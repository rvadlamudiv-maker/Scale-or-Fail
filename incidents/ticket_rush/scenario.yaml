incident:
  title: Ticketmaster's Eras Tour presale
  date: "2022-11-15"
  postmortem_url: https://business.ticketmaster.com/press-release/taylor-swift-the-eras-tour-onsale-explained/
  summary: >-
    Over 3.5 million fans registered for the Verified Fan presale of Taylor Swift's Eras Tour. When it
    opened, bots and fans without invite codes joined them, and the site took 3.5 billion system
    requests - four times Ticketmaster's previous peak. To keep its systems up, Ticketmaster slowed
    some sales and pushed others back, and fans waited for hours in the queue. More than two million
    tickets still sold that day, a record for one artist, but the general public sale was cancelled.
  real_fixes:
    - Slowed down some sales and pushed others back, so the systems stayed up and the queue absorbed the rush (fans waited longer instead of everything crashing).
    - Used Verified Fan invite codes to limit how many people could buy at once, putting the rest on a waitlist.
    - Cancelled the general public sale, citing extraordinarily high demand on its ticketing systems.
