name: The Ticket Rush
description: The biggest presale ever opens at 10 seconds in. Four times your all-time peak hits the checkout at once - and the seat inventory database can only take so much.
hint: "Does a fan really need their order finished while they wait on the page? What if the rush waited in line instead of hitting the database all at once - and how many workers can actually read from that line?"
