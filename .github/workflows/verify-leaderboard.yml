name: Verify leaderboard

on:
  schedule:
    - cron: "17 7 * * *" # every night, ~2am Central
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print verdicts only, write nothing"
        type: boolean
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pydantic pyyaml
      - name: Re-run every unverified design
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: python scripts/verify_daily.py ${{ inputs.dry_run && '--dry-run' || '' }}
